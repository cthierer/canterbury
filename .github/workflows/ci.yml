name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact main-reachable Git ref or full commit SHA to publish'
        required: true
        type: string
      image:
        description: 'Image package to publish'
        required: true
        default: all
        type: choice
        options:
          - all
          - mcp-server
          - vault-service
          - sync

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Set to a non-zero integer to enforce a minimum coverage percentage.
  COVERAGE_THRESHOLD: 0

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Record checked revision
        id: revision
        run: |
          revision=$(git rev-parse --verify HEAD^{commit})
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character commit SHA, got: $revision" >&2
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: ${{ runner.os }}-cache-${{ hashFiles('go.sum', 'package-lock.json', 'sync/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Install dependencies and tools
        run: make setup

      - name: Check formatting
        run: npm run format:check

      - name: Check Go formatting
        run: npm run format:go:check

      - name: Lint protobuf
        run: npm run proto:lint

      - name: Run Go tests with coverage
        run: |
          GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod \
            go test -coverprofile=coverage.out ./cmd/... ./internal/... ./gen/go/...

      - name: Report coverage
        run: |
          {
            echo '## Test Coverage'
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if [ "$COVERAGE_THRESHOLD" -eq 0 ]; then
            echo "No minimum coverage threshold configured."
          elif awk "BEGIN { exit ($total >= $COVERAGE_THRESHOLD) ? 0 : 1 }"; then
            echo "Coverage ${total}% meets the configured minimum of ${COVERAGE_THRESHOLD}%."
          else
            echo "Coverage ${total}% is below the configured minimum of ${COVERAGE_THRESHOLD}%."
            exit 1
          fi

      - name: Lint Go
        run: make lint

      - name: Lint JavaScript
        run: npm --prefix sync run check:code

      - name: Check TypeScript and script tests
        run: npm run typecheck && npm run test:scripts

  build-images:
    name: Build deployment images
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ needs.check.outputs.revision }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build all images without registry access
        env:
          CHECKED_REVISION: ${{ needs.check.outputs.revision }}
        run: MODE=build REF="$CHECKED_REVISION" make publish-images

      - name: Inspect image runtime and OCI configuration
        env:
          CHECKED_REVISION: ${{ needs.check.outputs.revision }}
        run: |
          inspect_image() {
            image="$1"
            test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            test -n "$user"
            test "$user" != 'root'
            test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" != 'null'
            test "$(docker image inspect "$image" --format '{{json .Config.Healthcheck}}')" != 'null'
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = 'https://github.com/cthierer/canterbury'
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$CHECKED_REVISION"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "sha-$CHECKED_REVISION"
            test -n "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = 'MIT'
            test -n "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.title"}}')"
            test -n "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.description"}}')"
          }
          inspect_image "ghcr.io/cthierer/canterbury-mcp-server:sha-$CHECKED_REVISION"
          inspect_image "ghcr.io/cthierer/canterbury-vault-service:sha-$CHECKED_REVISION"
          inspect_image "ghcr.io/cthierer/canterbury-sync:sha-$CHECKED_REVISION"

  publish-images:
    name: Publish deployment images
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-images-${{ needs.check.outputs.revision }}
      cancel-in-progress: false
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
      mcp_server_digest: ${{ steps.publish.outputs.mcp_server_digest }}
      vault_service_digest: ${{ steps.publish.outputs.vault_service_digest }}
      sync_digest: ${{ steps.publish.outputs.sync_digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.revision }}

      - name: Validate requested revision is reachable from main
        env:
          PUBLISH_REF: ${{ needs.check.outputs.revision }}
        run: |
          git fetch --no-tags origin main
          commit=$(git rev-parse --verify "${PUBLISH_REF}^{commit}")
          git merge-base --is-ancestor "$commit" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate publish inputs before authentication
        env:
          PUBLISH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.image || 'all' }}
          PUBLISH_REF: ${{ needs.check.outputs.revision }}
        run: MODE=dry-run IMAGE="$PUBLISH_IMAGE" REF="$PUBLISH_REF" make publish-images

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable images
        id: publish
        env:
          IMAGE_DIGESTS_FILE: .cache/image-digests.json
          PUBLISH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.image || 'all' }}
          PUBLISH_REF: ${{ needs.check.outputs.revision }}
        run: MODE=push IMAGE="$PUBLISH_IMAGE" REF="$PUBLISH_REF" make publish-images

      - name: Upload immutable image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: image-digests-${{ steps.publish.outputs.revision }}
          path: .cache/image-digests.json
